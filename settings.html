<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f0f0" />
    <meta name="description" content="Calla의 근무 시간과 휴가 기준을 설정하세요." />
    <title>Calla · Settings</title>
    <link rel="icon" href="./assets/figma/calla-logo.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles-v2.css" />
  </head>
  <body class="design-v2" data-page="settings">
    <div class="app-shell">
      <header class="topbar" data-page-enter>
        <h1>설정</h1>
        <nav class="top-actions" aria-label="페이지 메뉴">
          <a class="icon-link" href="./vacation.html" aria-label="휴가 관리" data-page-link><img src="./assets/figma/icon-vacation.svg" alt="" width="24" height="24" /></a>
          <a class="icon-link" href="./settings.html" aria-label="설정" aria-current="page"><img src="./assets/figma/icon-settings.svg" alt="" width="24" height="24" /></a>
        </nav>
      </header>

      <main class="page-content settings-content">
        <form id="settingsForm" novalidate>
          <section class="card settings-card basic-settings" aria-labelledby="basicSettingsTitle" data-reveal>
            <h2 id="basicSettingsTitle">기본 설정</h2>
            <div class="input-block">
              <label class="line-control date-control">
                <span class="control-label">입사일</span>
                <span class="display-input date-display">
                  <span class="display-value" data-display-for="hireDate">0000. 00. 00.</span>
                  <input id="hireDate" name="hireDate" type="date" aria-describedby="vacationSettingsNote" />
                </span>
              </label>
              <p class="field-note" id="vacationSettingsNote">입사일자를 선택하면 휴가일수가 자동 계산되어 적용됩니다.</p>
            </div>
          </section>

          <section class="card settings-card work-settings" id="workSettingsCard" aria-labelledby="workSettingsTitle" data-reveal>
            <h2 id="workSettingsTitle">근무 시간 설정</h2>
            <div class="input-block">
              <label class="line-control time-control">
                <span class="control-label">출근 시각 입력</span>
                <span class="display-input split-display">
                  <span class="display-value"><b data-time-hour="startTime">00</b>시</span>
                  <span class="display-value"><b data-time-minute="startTime">00</b>분</span>
                  <input id="startTime" name="startTime" type="time" required />
                </span>
              </label>
              <p class="field-note">근로계약서 상 출근 시각을 입력해주세요.</p>
            </div>
            <label class="check-control">
              <input id="freeWorkEnabled" name="freeWorkEnabled" type="checkbox" />
              <span class="check-box" aria-hidden="true"><img src="./assets/figma/checkmark.svg" alt="" /></span>
              <span>자율출퇴근제 사용</span>
            </label>
            <div class="input-block">
              <label class="line-control number-control">
                <span class="control-label">하루 총 근무시간</span>
                <span class="display-input single-display">
                  <span class="display-value"><b data-number-value="workHours">0</b>시간</span>
                  <input id="workHours" name="workHours" type="number" min="1" max="16" step="0.5" inputmode="decimal" />
                </span>
              </label>
              <p class="field-note" id="workDurationNote">점심시간을 제외한 하루 총 근무시간을 입력해주세요.</p>
            </div>
          </section>

          <section class="card settings-card lunch-settings" aria-labelledby="lunchSettingsTitle" data-reveal>
            <h2 id="lunchSettingsTitle">점심 시간 설정</h2>
            <div class="input-block">
              <label class="line-control number-control">
                <span class="control-label">점심 시간 입력</span>
                <span class="display-input split-display">
                  <span class="display-value"><b data-duration-hour="lunchMinutes">0</b>시간</span>
                  <span class="display-value"><b data-duration-minute="lunchMinutes">0</b>분</span>
                  <input id="lunchMinutes" name="lunchMinutes" type="number" min="0" max="240" step="5" inputmode="numeric" />
                </span>
              </label>
              <p class="field-note" id="lunchDurationNote">총 점심 시간을 입력해주세요. 근로계약서 상 휴게 시간입니다.</p>
            </div>
            <div class="input-block">
              <label class="line-control time-control">
                <span class="control-label">점심 시작 시각</span>
                <span class="display-input split-display">
                  <span class="display-value"><b data-time-hour="lunchStart">00</b>시</span>
                  <span class="display-value"><b data-time-minute="lunchStart">00</b>분</span>
                  <input id="lunchStart" name="lunchStart" type="time" />
                </span>
              </label>
              <p class="field-note">점심 시간 시작 시각을 입력해주세요.</p>
            </div>
            <label class="check-control">
              <input id="noFixedLunch" type="checkbox" />
              <span class="check-box" aria-hidden="true"><img src="./assets/figma/checkmark.svg" alt="" /></span>
              <span>정해진 점심 시간이 없어요.</span>
            </label>
          </section>

          <section class="card settings-card vacation-settings" aria-labelledby="vacationPolicyTitle" data-reveal>
            <h2 id="vacationPolicyTitle">휴가 설정</h2>
            <div class="policy-list">
              <label class="policy-row">
                <span><strong>휴가 당겨쓰기 허용</strong><small>잔여 휴가가 부족하더라도 당겨쓸 수 있게 합니다.</small></span>
                <span class="switch"><input id="allowVacationAdvance" name="allowVacationAdvance" type="checkbox" /><span aria-hidden="true"></span></span>
              </label>
              <label class="policy-row">
                <span><strong>미사용 연차 소진</strong><small>정해진 기한 내 휴가를 사용하지 않으면 소진됩니다.<br />단, 월차는 설정과 관계 없이 1년 내 미사용 시 무조건 소진됩니다.</small></span>
                <span class="switch"><input id="expireUnusedVacation" name="expireUnusedVacation" type="checkbox" /><span aria-hidden="true"></span></span>
              </label>
            </div>
          </section>

          <div class="compat-data" hidden aria-hidden="true">
            <input id="endTime" name="endTime" type="time" />
            <input id="lunchEnabled" name="lunchEnabled" type="checkbox" />
            <input id="lunchEnd" name="lunchEnd" type="time" />
            <input id="overtimeEnabled" name="overtimeEnabled" type="checkbox" />
            <input id="overtimeEndTime" name="overtimeEndTime" type="time" />
            <input id="includeOvertimeInProgress" name="includeOvertimeInProgress" type="checkbox" />
            <input id="birthday" name="birthday" type="date" />
            <div id="lunchFields"></div><div id="overtimeFields"></div>
            <p id="overtimeDurationNote"></p><h2 id="summaryTitle"></h2><p id="summaryDescription"></p><span id="summaryChip"></span>
          </div>
          <p class="form-error" id="formError" role="alert"></p>
          <button class="sr-only" type="submit">설정 저장</button>
        </form>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./vacation-core.js" defer></script>
    <script src="./app.js" defer></script>
    <script type="module" src="./motion.js"></script>
  </body>
</html>
